apiVersion: v1
kind: PersistentVolume
metadata:
  name: faralpha-mongo-pv
spec:
  capacity:
    storage: 2Gi
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: faralpha
    name: mongo-data
  hostPath:
    path: /data/faralpha/mongodb
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: faralpha
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: faralpha-mongo-pv
  resources:
    requests:
      storage: 2Gi
