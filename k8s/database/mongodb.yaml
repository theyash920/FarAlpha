apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: faralpha
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: faralpha
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: mongodb
          image: mongo:8.0.38
          args: ["mongod", "--auth", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.26"]
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef: {name: mongodb-credentials, key: root-username}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: mongodb-credentials, key: root-password}
            - name: MONGO_APP_USERNAME
              valueFrom:
                secretKeyRef: {name: mongodb-credentials, key: app-username}
            - name: MONGO_APP_PASSWORD
              valueFrom:
                secretKeyRef: {name: mongodb-credentials, key: app-password}
          resources:
            requests: {cpu: 200m, memory: 250M}
            limits: {cpu: 500m, memory: 500M}
          startupProbe:
            tcpSocket: {port: mongo}
            periodSeconds: 3
            failureThreshold: 90
          readinessProbe:
            tcpSocket: {port: mongo}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: mongo}
            periodSeconds: 15
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-data
        - name: init
          configMap:
            name: mongodb-init
            items:
              - key: 10-app-user.js
                path: 10-app-user.js
